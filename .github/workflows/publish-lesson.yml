# Publishes lessons pushed by the daily scheduled task.
#
# The task commits one new file, content/lessons/YYYY-MM-DD-<slug>.html, to a
# claude/* branch. If that push contains ONLY new lesson files, this workflow
# validates them, test-builds the site, and fast-forwards main. Vercel then
# deploys main automatically. Anything else on the branch is left for review.
name: Publish lesson

on:
  push:
    branches: ['claude/**', 'lessons/**']
    paths: ['content/lessons/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-lesson
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the branch only adds lessons
        id: scope
        run: |
          git fetch origin main
          base=$(git merge-base origin/main HEAD)
          changed=$(git diff --name-only --diff-filter=ACMRD "$base" HEAD)
          echo "Changed files:"; echo "$changed"
          if [ -z "$changed" ]; then echo "only=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          others=$(echo "$changed" | grep -vE '^content/lessons/[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9-]+\.html$' || true)
          deleted=$(git diff --name-only --diff-filter=D "$base" HEAD)
          if [ -n "$others" ] || [ -n "$deleted" ]; then
            echo "::notice::Branch changes more than new lesson files; leaving it for a pull request."
            echo "only=false" >> "$GITHUB_OUTPUT"
          else
            echo "only=true" >> "$GITHUB_OUTPUT"
            echo "files<<EOF" >> "$GITHUB_OUTPUT"; echo "$changed" >> "$GITHUB_OUTPUT"; echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.only == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Validate and test-build
        if: steps.scope.outputs.only == 'true'
        run: |
          npm ci
          node scripts/check-lessons.mjs ${{ steps.scope.outputs.files }}
          npx nuxt build

      - name: Fast-forward main
        if: steps.scope.outputs.only == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only new files, so replaying them onto the latest main can't conflict.
          git rebase origin/main
          git push origin HEAD:main
          git push origin --delete "${GITHUB_REF_NAME}" || true

      - name: Announce in the newsletter (Kit)
        if: steps.scope.outputs.only == 'true' && env.KIT_API_KEY != ''
        continue-on-error: true
        env:
          KIT_BROADCAST_MODE: ${{ vars.KIT_BROADCAST_MODE }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          # Give Vercel a few minutes to deploy before the email links go live.
          sleep 180
          node scripts/kit-broadcast.mjs ${{ steps.scope.outputs.files }}
